type: collection.insomnia.rest/5.0
schema_version: '5.1'
name: DistriNorte API
meta:
  id: wrk_distrinorte_api_001
  created: 1750752000000
  modified: 1750752000000
  description: |
    Colección para probar la API B2B de DistriNorte (dev).

    ## Antes de empezar

    1. Obtén outputs de Terraform (`iac/environments/dev`):
       - `cognito_user_pool_id`
       - `cognito_app_client_id`
       - `cognito_hosted_ui_base_url`
    2. Crea usuarios demo en Cognito (ver carpeta **00 Setup**).
    3. Genera un **Id Token** con AWS CLI y pégalo en `access_token` del environment.
    4. Selecciona el sub-environment **DistriNorte Dev**.

    ## Base URL

    Por defecto: CloudFront `https://api.pedidos.galaxymorph.com`
    Alternativa: `api_gateway_invoke_url` (sub-environment **API Gateway directo**).

    ## Autenticación

    API Gateway exige **Cognito JWT** (`Authorization: Bearer <IdToken>`).
    Los requests heredan Bearer desde el environment `access_token`.

    ## Datos demo (post seed)

    - Bodega El Norte SAC — demo.elnorte@distrinorte.demo — customer_id 11111111-1111-4111-8111-111111111111
    - Minimarket Sur EIRL — demo.minsur@distrinorte.demo — customer_id 22222222-2222-4222-8222-222222222222

    Almacenes: chiclayo, piura. SKU ejemplo: COCA-600ML.

    ## Respuesta estándar

    ```json
    { "data": { ... }, "correlationId": "..." }
    ```

    Errores: `{ "error": { "code": "...", "message": "..." } }`
collection:
  - name: '00 Setup'
    meta:
      id: fld_distrinorte_setup
      created: 1750752000001
      modified: 1750752000001
      sortKey: -5000
      description: |
        ## Crear usuarios Cognito (CLI)

        Reemplaza `POOL_ID` y ejecuta por cada usuario demo.

        ```bash
        cd iac/environments/dev
        export POOL_ID="$(terraform output -raw cognito_user_pool_id)"
        export AWS_REGION=us-east-2

        # Usuario 1 — Bodega El Norte
        aws cognito-idp admin-create-user \
          --region "$AWS_REGION" \
          --user-pool-id "$POOL_ID" \
          --username "demo.elnorte@distrinorte.demo" \
          --user-attributes \
            Name=email,Value=demo.elnorte@distrinorte.demo \
            Name=email_verified,Value=true \
            Name=custom:customer_id,Value=11111111-1111-4111-8111-111111111111 \
          --message-action SUPPRESS

        aws cognito-idp admin-set-user-password \
          --region "$AWS_REGION" \
          --user-pool-id "$POOL_ID" \
          --username "demo.elnorte@distrinorte.demo" \
          --password 'DistriNorte-Demo-2026!' \
          --permanent

        # Usuario 2 — Minimarket Sur
        aws cognito-idp admin-create-user \
          --region "$AWS_REGION" \
          --user-pool-id "$POOL_ID" \
          --username "demo.minsur@distrinorte.demo" \
          --user-attributes \
            Name=email,Value=demo.minsur@distrinorte.demo \
            Name=email_verified,Value=true \
            Name=custom:customer_id,Value=22222222-2222-4222-8222-222222222222 \
          --message-action SUPPRESS

        aws cognito-idp admin-set-user-password \
          --region "$AWS_REGION" \
          --user-pool-id "$POOL_ID" \
          --username "demo.minsur@distrinorte.demo" \
          --password 'DistriNorte-Demo-2026!' \
          --permanent
        ```

        ## Obtener Id Token para Insomnia

        Requiere `ALLOW_ADMIN_USER_PASSWORD_AUTH` en el app client (Terraform).
        Tras `terraform apply`, ejecuta:

        ```bash
        export CLIENT_ID="$(terraform output -raw cognito_app_client_id)"

        aws cognito-idp admin-initiate-auth \
          --region "$AWS_REGION" \
          --user-pool-id "$POOL_ID" \
          --client-id "$CLIENT_ID" \
          --auth-flow ADMIN_USER_PASSWORD_AUTH \
          --auth-parameters \
            USERNAME=demo.elnorte@distrinorte.demo,PASSWORD='DistriNorte-Demo-2026!' \
          --query 'AuthenticationResult.IdToken' \
          --output text
        ```

        Copia el token en el environment **access_token** (sin prefijo "Bearer ").
    children:
      - name: '(leer descripción de la carpeta)'
        meta:
          id: req_distrinorte_setup_readme
