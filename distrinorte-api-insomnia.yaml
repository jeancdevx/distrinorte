  - name: '02 Catalog'
    meta:
      id: fld_distrinorte_catalog
      created: 1750752000200
      modified: 1750752000200
      sortKey: -3000
      description: |
        Catálogo DynamoDB + stock Redis.
        `warehouseId` es obligatorio. Solo productos `active: true` (24 de 25 en demo).
    children:
      - name: List products (chiclayo)
        meta:
          id: req_catalog_products_chiclayo
          created: 1750752000201
          modified: 1750752000201
          isPrivate: false
          sortKey: -3001
          description: |
            Lista paginada de productos con stock para el almacén indicado.

            Query params:
            - `warehouseId` (requerido): chiclayo | piura
            - `page`, `limit` (opcional, defaults en shared pagination)
            - `category` (opcional): bebidas, abarrotes, etc.
        method: GET
        url: '{{ _.base_url }}/catalog/products'
        authentication:
          type: bearer
          token: '{{ _.access_token }}'
        headers:
          - name: x-correlation-id
            value: "{% uuid 'v4' %}"
        parameters:
          - name: warehouseId
            value: '{{ _.warehouse_id }}'
            disabled: false
          - name: page
            value: '1'
            disabled: false
          - name: limit
            value: '10'
            disabled: false
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - name: List products — filter category bebidas
        meta:
          id: req_catalog_products_bebidas
          created: 1750752000202
          modified: 1750752000202
          isPrivate: false
          sortKey: -3002
        method: GET
        url: '{{ _.base_url }}/catalog/products'
        authentication:
          type: bearer
          token: '{{ _.access_token }}'
        headers:
          - name: x-correlation-id
            value: "{% uuid 'v4' %}"
        parameters:
          - name: warehouseId
            value: '{{ _.warehouse_id }}'
          - name: category
            value: bebidas
          - name: page
            value: '1'
          - name: limit
            value: '20'
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - name: List products (piura)
        meta:
          id: req_catalog_products_piura
          created: 1750752000203
          modified: 1750752000203
          isPrivate: false
          sortKey: -3003
        method: GET
        url: '{{ _.base_url }}/catalog/products'
        authentication:
          type: bearer
          token: '{{ _.access_token }}'
        parameters:
          - name: warehouseId
            value: piura
          - name: page
            value: '1'
          - name: limit
            value: '10'
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
