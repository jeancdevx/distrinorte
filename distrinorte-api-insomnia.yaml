          - name: limit
            value: '20'
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - name: Create customer
        meta:
          id: req_customers_create
          created: 1750752000502
          modified: 1750752000502
          isPrivate: false
          sortKey: -502
          description: |
            Crea cliente + cuenta. `taxId` (RUC) debe ser único.
            Luego crea usuario Cognito con `custom:customer_id` = `id` devuelto.
        method: POST
        url: '{{ _.base_url }}/customers'
        authentication:
          type: bearer
          token: '{{ _.access_token }}'
        headers:
          - name: Content-Type
            value: application/json
          - name: x-correlation-id
            value: "{% uuid 'v4' %}"
        body:
          mimeType: application/json
          text: |
            {
              "name": "Cliente Prueba API",
              "taxId": "20111222333",
              "email": "prueba.api@distrinorte.demo"
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true

