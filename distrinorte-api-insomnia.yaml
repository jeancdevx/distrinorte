  - name: '03 Inventory'
    meta:
      id: fld_distrinorte_inventory
      created: 1750752000300
      modified: 1750752000300
      sortKey: -2000
      description: Stock puntual por SKU y almacén (RDS + cache Redis).
    children:
      - name: Get stock by SKU
        meta:
          id: req_inventory_stock
          created: 1750752000301
          modified: 1750752000301
          isPrivate: false
          sortKey: -2001
          description: |
            `GET /inventory/stock/:sku?warehouseId=...`

            Ejemplo: COCA-600ML en chiclayo (240 unidades tras seed).
        method: GET
        url: '{{ _.base_url }}/inventory/stock/{{ _.demo_sku }}'
        authentication:
          type: bearer
          token: '{{ _.access_token }}'
        headers:
          - name: x-correlation-id
            value: "{% uuid 'v4' %}"
        parameters:
          - name: warehouseId
            value: '{{ _.warehouse_id }}'
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true

  - name: '04 Orders'
    meta:
      id: fld_distrinorte_orders
      created: 1750752000400
      modified: 1750752000400
      sortKey: -1000
      description: |
        Crear pedido async (202). Requiere header `idempotency-key`.
        `customerId` viene del JWT (`custom:customer_id`).
        Tras 202, usar GET /orders/{orderId} para polling hasta CONFIRMED/REJECTED.
    children:
      - name: Create order (demo)
        meta:
          id: req_orders_create_demo
          created: 1750752000401
          modified: 1750752000401
          isPrivate: false
          sortKey: -1001
          description: |
            Pedido demo con Bodega El Norte y 2× COCA-600ML.

            `customerId` se toma del JWT (`custom:customer_id`), no del body.
            Cambia `idempotency-key` en cada pedido nuevo (o usa el environment `idempotency_key`).
            Re-enviar el mismo key devuelve el pedido existente (idempotencia).
        method: POST
        url: '{{ _.base_url }}/orders'
        authentication:
          type: bearer
          token: '{{ _.access_token }}'
        headers:
          - name: Content-Type
            value: application/json
          - name: idempotency-key
            value: '{{ _.idempotency_key }}'
          - name: x-correlation-id
            value: "{% uuid 'v4' %}"
        body:
          mimeType: application/json
          text: |
            {
              "warehouseId": "{{ _.warehouse_id }}",
              "lines": [
                { "sku": "{{ _.demo_sku }}", "quantity": 2 }
              ]
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - name: Create order — segundo cliente
        meta:
          id: req_orders_create_minsur
          created: 1750752000402
          modified: 1750752000402
          isPrivate: false
          sortKey: -1002
        method: POST
        url: '{{ _.base_url }}/orders'
        authentication:
          type: bearer
          token: '{{ _.access_token }}'
        headers:
          - name: Content-Type
            value: application/json
          - name: idempotency-key
            value: "demo-order-minsur-{% uuid 'v4' %}"
          - name: x-correlation-id
            value: "{% uuid 'v4' %}"
        body:
          mimeType: application/json
          text: |
            {
              "warehouseId": "piura",
              "lines": [
                { "sku": "INCA-600ML", "quantity": 1 },
                { "sku": "AGUA-SIN-GAS-625", "quantity": 3 }
              ]
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - name: List my orders
        meta:
          id: req_orders_list
          created: 1750752000403
          modified: 1750752000403
          isPrivate: false
          sortKey: -1003
          description: |
            Historial de pedidos del cliente autenticado (JWT `custom:customer_id`).
            Filtro opcional `status`: PENDING | CONFIRMED | REJECTED.
        method: GET
        url: '{{ _.base_url }}/orders'
        authentication:
          type: bearer
          token: '{{ _.access_token }}'
        headers:
          - name: x-correlation-id
            value: "{% uuid 'v4' %}"
        parameters:
          - name: page
            value: '1'
          - name: limit
            value: '20'
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - name: Get order by id
        meta:
          id: req_orders_get_by_id
          created: 1750752000404
          modified: 1750752000404
          isPrivate: false
          sortKey: -1004
          description: |
            Consulta estado de un pedido (polling tras POST 202).
            Usa `order_id` del environment o del último POST.
        method: GET
        url: '{{ _.base_url }}/orders/{{ _.order_id }}'
        authentication:
          type: bearer
          token: '{{ _.access_token }}'
        headers:
          - name: x-correlation-id
            value: "{% uuid 'v4' %}"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true

  - name: '05 Customers'
    meta:
      id: fld_distrinorte_customers
      created: 1750752000500
      modified: 1750752000500
      sortKey: -500
      description:
        Gestión de clientes B2B en RDS. El seed ya creó 2 clientes demo.
    children:
