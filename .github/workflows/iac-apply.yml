name: Terraform apply (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (dev, prod)
        required: true
        type: string
      terraform_directory:
        description: Ruta al módulo Terraform del entorno
        required: true
        type: string
      var_file:
        description: Archivo tfvars relativo a terraform_directory
        required: true
        type: string
      state_key:
        description: Clave del objeto de state en S3
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    name: Terraform apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: us-east-2
      TF_IN_AUTOMATION: true
      TF_DIR: ${{ inputs.terraform_directory }}
      TF_VAR_FILE: ${{ inputs.var_file }}
      TF_STATE_KEY: ${{ inputs.state_key }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build invoice-worker Lambda artifact
        run: pnpm --filter @distrinorte/invoice-worker build

      - name: Package invoice-worker zip
        run: |
          cd packages/invoice-worker/dist
          zip -q handler.zip index.js

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.11.4

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config=backend.ci.hcl \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_redis_auth_token: ${{ secrets.TF_VAR_redis_auth_token }}
          TF_VAR_origin_verify_secret:
            ${{ secrets.TF_VAR_origin_verify_secret }}
          TF_VAR_container_image_tag: ${{ github.sha }}
          TF_VAR_terraform_state_bucket: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform apply -auto-approve -input=false \
            -var-file="${TF_VAR_FILE}" \
            -var="aws_profile="
