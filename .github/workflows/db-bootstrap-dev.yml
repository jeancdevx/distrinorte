name: DB bootstrap dev

on:
  push:
    branches: [develop]
    paths:
      - 'packages/database/**'
      - 'packages/seed/**'
      - 'data/demo/**'
      - 'docker/Dockerfile.seed'
      - '.github/workflows/db-bootstrap-dev.yml'
  workflow_dispatch:
    inputs:
      force:
        description: Ejecutar seed aunque no haya cambios en paths
        required: false
        type: boolean
        default: false

concurrency:
  group: db-bootstrap-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  NAME_PREFIX: distrinorte-dev

jobs:
  bootstrap:
    name: Run seed-runner task
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push seed-runner image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.seed
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.NAME_PREFIX }}-seed-runner:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.NAME_PREFIX }}-seed-runner:latest
          cache-from: type=gha,scope=seed-runner
          cache-to: type=gha,scope=seed-runner,mode=max

      - name: Register task definition with new image
        id: task
        env:
          IMAGE:
            ${{ steps.ecr.outputs.registry }}/${{ env.NAME_PREFIX
            }}-seed-runner:${{ github.sha }}
        run: |
          FAMILY="${NAME_PREFIX}-seed-runner"
          CURRENT=$(aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --query 'taskDefinition' \
            --output json)
          NEW_DEF=$(echo "$CURRENT" | jq \
            --arg IMAGE "$IMAGE" \
            '.containerDefinitions[0].image = $IMAGE
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
          REV=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_DEF" \
            --query 'taskDefinition.revision' \
            --output text)
          echo "family=$FAMILY" >> "$GITHUB_OUTPUT"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"

      - name: Run seed-runner ECS task
        id: run
        run: |
          SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=${NAME_PREFIX}-private-*" \
            --query 'Subnets[*].SubnetId' \
            --output text | tr '\t' ',')
          SG=$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=${NAME_PREFIX}-ecs-sg" \
            --query 'SecurityGroups[0].GroupId' \
            --output text)
          TASK_ARN=$(aws ecs run-task \
            --cluster "${NAME_PREFIX}-cluster" \
            --task-definition "${{ steps.task.outputs.family }}:${{ steps.task.outputs.revision }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SG}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

      - name: Wait for task completion
        run:
          bash scripts/ci/wait-for-ecs-task.sh "${{ steps.run.outputs.task_arn
          }}" "${NAME_PREFIX}-cluster"

      - name: Tail CloudWatch logs on failure
        if: failure()
        run: |
          LOG_GROUP="/ecs/${NAME_PREFIX}-seed-runner"
          STREAM=$(aws logs describe-log-streams \
            --log-group-name "$LOG_GROUP" \
            --order-by LastEventTime \
            --descending \
            --max-items 1 \
            --query 'logStreams[0].logStreamName' \
            --output text)
          if [ "$STREAM" != "None" ] && [ -n "$STREAM" ]; then
            aws logs get-log-events \
              --log-group-name "$LOG_GROUP" \
              --log-stream-name "$STREAM" \
              --limit 50 \
              --query 'events[*].message' \
              --output text
          fi
