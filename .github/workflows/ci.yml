name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - production

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Lint, format, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac/environments/dev
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.11.4

      - name: Terraform fmt check
        working-directory: iac
        run: terraform fmt -check -recursive

      - name: Terraform init (local backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  docker-build:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build service images
        run: |
          set -euo pipefail
          docker build -f docker/Dockerfile.service --build-arg SERVICE=customers-service -t customers-service:ci .
          docker build -f docker/Dockerfile.service --build-arg SERVICE=inventory-service -t inventory-service:ci .
          docker build -f docker/Dockerfile.service --build-arg SERVICE=orders-service -t orders-service:ci .
          docker build -f docker/Dockerfile.service --build-arg SERVICE=catalog-service -t catalog-service:ci .
          docker build -f docker/Dockerfile.seed -t seed-runner:ci .
