name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  TURBO_TELEMETRY_DISABLED: '1'
  TZ: America/Lima

jobs:
  quality:
    name: Lint · Format · Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build workspace deps for tests
        run: |
          pnpm --filter @distrinorte/shared build
          pnpm --filter @distrinorte/database build
          pnpm --filter @distrinorte/events build

      - name: Test
        run: pnpm test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.services.outputs.list }}
      iac: ${{ steps.filter-iac.outputs.iac }}
      invoice-worker: ${{ steps.filter-services.outputs.invoice-worker }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter service paths
        id: filter-services
        uses: dorny/paths-filter@v4
        with:
          filters: .github/filters/services.yml

      - name: Filter IaC paths
        id: filter-iac
        uses: dorny/paths-filter@v4
        with:
          filters: |
            iac:
              - 'iac/**'

      - name: Build service matrix
        id: services
        env:
          CHANGES: ${{ steps.filter-services.outputs.changes }}
        run: |
          list=$(echo "$CHANGES" | jq -c '[.[] | select(. == ("customers-service", "inventory-service", "orders-service", "catalog-service", "seed-runner"))]')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Changed services: $list"

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build service image (no push)
        if: matrix.service != 'seed-runner'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.service
          build-args: SERVICE=${{ matrix.service }}
          push: false
          tags: distrinorte-${{ matrix.service }}:pr
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Build seed-runner image (no push)
        if: matrix.service == 'seed-runner'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.seed
          push: false
          tags: distrinorte-seed-runner:pr
          cache-from: type=gha,scope=seed-runner
          cache-to: type=gha,scope=seed-runner,mode=max

  invoice-worker:
    name: Build invoice-worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.invoice-worker == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Package Lambda zip
        run: pnpm --filter @distrinorte/invoice-worker package:lambda

  iac:
    name: Terraform fmt · validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.iac == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.11.4

      - name: Terraform fmt
        run: terraform fmt -check -recursive iac

      - name: Terraform validate (dev)
        working-directory: iac/environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate
