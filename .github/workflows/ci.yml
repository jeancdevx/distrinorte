name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - production

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac/environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Terraform init (local backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build service images
        run: |
          docker build -f docker/Dockerfile.service --build-arg SERVICE=customers-service -t customers-service:ci .
          docker build -f docker/Dockerfile.service --build-arg SERVICE=inventory-service -t inventory-service:ci .
          docker build -f docker/Dockerfile.service --build-arg SERVICE=orders-service -t orders-service:ci .
          docker build -f docker/Dockerfile.service --build-arg SERVICE=catalog-service -t catalog-service:ci .
          docker build -f docker/Dockerfile.seed -t seed-runner:ci .
