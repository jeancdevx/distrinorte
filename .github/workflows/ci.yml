name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - production

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Lint, format, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac/environments/dev
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.11.4

      - name: Terraform fmt check
        working-directory: iac
        run: terraform fmt -check -recursive

      - name: Terraform init (local backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  docker-build:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Build service images
        run: |
          set -euo pipefail
          docker build -f docker/Dockerfile.service --build-arg SERVICE=customers-service -t customers-service:ci .
          docker build -f docker/Dockerfile.service --build-arg SERVICE=inventory-service -t inventory-service:ci .
          docker build -f docker/Dockerfile.service --build-arg SERVICE=orders-service -t orders-service:ci .
          docker build -f docker/Dockerfile.service --build-arg SERVICE=catalog-service -t catalog-service:ci .
          docker build -f docker/Dockerfile.seed -t seed-runner:ci .
