name: Deploy Dev

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: Ejecutar migrate + seed en ECS tras el deploy
        type: boolean
        default: true
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: us-east-2
  TF_IN_AUTOMATION: true
  TF_VAR_environment: dev
  TF_VAR_project_name: distrinorte

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64

      - name: Build and push images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          for service in customers-service inventory-service orders-service catalog-service; do
            image="${ECR_REGISTRY}/distrinorte-dev-${service}:${IMAGE_TAG}"
            docker build -f docker/Dockerfile.service --build-arg "SERVICE=${service}" -t "${image}" .
            docker push "${image}"
            docker tag "${image}" "${ECR_REGISTRY}/distrinorte-dev-${service}:latest"
            docker push "${ECR_REGISTRY}/distrinorte-dev-${service}:latest"
          done

          seed_image="${ECR_REGISTRY}/distrinorte-dev-seed-runner:${IMAGE_TAG}"
          docker build -f docker/Dockerfile.seed -t "${seed_image}" .
          docker push "${seed_image}"
          docker tag "${seed_image}" "${ECR_REGISTRY}/distrinorte-dev-seed-runner:latest"
          docker push "${ECR_REGISTRY}/distrinorte-dev-seed-runner:latest"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.11.4

      - name: Terraform apply
        working-directory: iac/environments/dev
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_redis_auth_token: ${{ secrets.TF_VAR_redis_auth_token }}
          TF_VAR_origin_verify_secret:
            ${{ secrets.TF_VAR_origin_verify_secret }}
          TF_VAR_container_image_tag: ${{ github.sha }}
          TF_VAR_terraform_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false \
            -backend-config=backend.ci.hcl \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          terraform apply -var-file=ci.tfvars -auto-approve -input=false

      - name: Run seed task on ECS
        if: github.event_name == 'push' || inputs.run_seed != false
        env:
          CLUSTER: distrinorte-dev-cluster
          TASK_FAMILY: distrinorte-dev-seed-runner
        run: |
          set -euo pipefail
          SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=distrinorte-dev-private-*" \
            --query 'Subnets[].SubnetId' \
            --output text | tr '\t' ',')
          SECURITY_GROUP=$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=distrinorte-dev-ecs-sg" \
            --query 'SecurityGroups[0].GroupId' \
            --output text)
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          TASK_ARN=$(aws ecs run-task \
            --cluster "${CLUSTER}" \
            --task-definition "${TASK_DEF}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUP}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)
          bash scripts/ci/wait-for-ecs-task.sh "${TASK_ARN}" "${CLUSTER}"

      - name: Force ECS rolling deploy
        run: |
          set -euo pipefail
          for service in distrinorte-dev-customers-service distrinorte-dev-inventory-service distrinorte-dev-orders-service distrinorte-dev-catalog-service; do
            aws ecs update-service \
              --cluster distrinorte-dev-cluster \
              --service "${service}" \
              --force-new-deployment
          done
