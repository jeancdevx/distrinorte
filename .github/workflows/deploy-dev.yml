name: Deploy dev

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      force_all:
        description: Redesplegar todos los servicios aunque no tengan cambios
        required: false
        type: boolean
        default: false
      run_smoke:
        description: Ejecutar smoke HTTP post-deploy
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      force_all:
        ${{ github.event_name == 'workflow_dispatch' && inputs.force_all }}
      run_smoke:
        ${{ github.event_name != 'workflow_dispatch' || inputs.run_smoke }}
    secrets: inherit
